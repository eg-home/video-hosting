<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script src="mraid.js"></script>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; }
  #root { width:100%; height:100%; display:flex; flex-direction:column; font-family:-apple-system, Roboto, sans-serif; text-align:center; color:#fff; -webkit-user-select:none; user-select:none; }
  #info  { flex:1; background:#0A84FF; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #click { height:30%; background:#0A6E2F; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #close { height:18%; background:#fff; color:#0A84FF; display:flex; align-items:center; justify-content:center; font-weight:700; }
  b { font-size:18px; }
  #state { font-size:12px; }
</style>
</head>
<body>
<div id="root">
  <div id="info">
    <b>SDK-181 · EXPANDED (PART 2)</b>
    <div id="state">state: …</div>
  </div>
  <div id="click">
    <b>TAP = CLICK (mraid.open)</b>
    <div>bidmachine.io</div>
  </div>
  <div id="close">CLOSE (mraid.close)</div>
</div>
<script>
  var CLICK_URL = "https://bidmachine.io";

  function log(m) { console.log("[sdk181-part2] " + m); }
  function showState() {
    try { document.getElementById("state").textContent = "state: " + mraid.getState(); } catch (e) {}
  }

  function onReady() {
    log("part2 loaded, state=" + mraid.getState()); // ожидаем: expanded
    showState();
    mraid.addEventListener("stateChange", function (s) { log("stateChange -> " + s); showState(); });
    mraid.addEventListener("error", function (msg, action) { log("MRAID ERROR action=" + action + " msg=" + msg); });

    document.getElementById("click").addEventListener("touchend", function (e) {
      e.stopPropagation();
      log("user tap -> mraid.open(click) from expanded");
      mraid.open(CLICK_URL);
    });
    document.getElementById("close").addEventListener("touchend", function (e) {
      e.stopPropagation();
      log("close tapped -> mraid.close()");
      mraid.close();
    });
  }

  if (typeof mraid !== "undefined" && mraid.getState() !== "loading") { onReady(); }
  else if (typeof mraid !== "undefined") { mraid.addEventListener("ready", onReady); }
  else { log("no mraid object!"); }
</script>
</body>
</html>
